apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mediamanager-config-pvc
  namespace: media
  labels:
    app: mediamanager
spec:
  storageClassName: ceph-block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mediamanager-data-pvc
  namespace: media
  labels:
    app: mediamanager
spec:
  storageClassName: ceph-block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi