apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: snapshot-upgrade-smoke-rbd-restore
  labels:
    app: snapshot-upgrade-smoke
  namespace: apps
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 1Gi
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: snapshot-upgrade-smoke-rbd
---
apiVersion: batch/v1
kind: Job
metadata:
  name: snapshot-upgrade-smoke-rbd-verify
  labels:
    app: snapshot-upgrade-smoke
  namespace: apps
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: snapshot-upgrade-smoke
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: proof
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -ec
        - 'test "$(cat /restored/proof)" = ''rbd-snapshot-original''; printf ''%s\n''
          ''rbd-source-changed'' > /source/proof; sync; test "$(cat /source/proof)"
          = ''rbd-source-changed''; test "$(cat /restored/proof)" = ''rbd-snapshot-original'';
          printf ''Source: ''; cat /source/proof; printf ''Restored: ''; cat /restored/proof'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: source
          mountPath: /source
        - name: restored
          mountPath: /restored
      volumes:
      - name: source
        persistentVolumeClaim:
          claimName: snapshot-upgrade-smoke-rbd-source
      - name: restored
        persistentVolumeClaim:
          claimName: snapshot-upgrade-smoke-rbd-restore
---
