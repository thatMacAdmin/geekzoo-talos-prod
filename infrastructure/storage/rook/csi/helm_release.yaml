apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
  namespace: rook-ceph
spec:
  interval: 30m
  releaseName: ceph-csi-drivers
  dependsOn:
    - name: rook-operator
  chart:
    spec:
      chart: ceph-csi-drivers
      version: "1.1.0"
      sourceRef:
        kind: HelmRepository
        name: ceph-csi-operator
        namespace: rook-ceph
  install:
    # Adopt the existing Rook-generated Driver/OperatorConfig CRs in place.
    disableTakeOwnership: false
    strategy:
      name: RetryOnFailure
  upgrade:
    disableTakeOwnership: false
    strategy:
      name: RetryOnFailure
  valuesFrom:
    - kind: ConfigMap
      name: ceph-csi-drivers-values
      valuesKey: values.yaml
