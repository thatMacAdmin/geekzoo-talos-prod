apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-upgrade-smoke-rbd
  namespace: rook-ceph
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: storage-upgrade-smoke-rbd-remount
  namespace: rook-ceph
spec:
  nodeSelector:
    kubernetes.io/hostname: talos-node-02
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: smoke
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 86400
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: storage-upgrade-smoke-rbd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-upgrade-smoke-cephfs
  namespace: rook-ceph
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: ceph-filesystem
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: storage-upgrade-smoke-cephfs-remount
  namespace: rook-ceph
spec:
  nodeSelector:
    kubernetes.io/hostname: talos-node-02
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: smoke
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 86400
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: storage-upgrade-smoke-cephfs
