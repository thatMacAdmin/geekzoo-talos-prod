# A flux managed helm release for the rook operator
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-operator
  namespace: rook-ceph
spec:
  interval: 30m
  releaseName: rook-ceph
  chart:
    spec:
      chart: rook-ceph
      version: "1.21.0"
      sourceRef:
        kind: HelmRepository
        name: rook-operator
        namespace: rook-ceph
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    monitoring:
      enabled: true
    csi:
      installCsiOperator: true
      cephcsi:
        repository: quay.io/cephcsi/cephcsi
        tag: v3.17.1
      registrar:
        repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
        tag: v2.17.0
      provisioner:
        repository: registry.k8s.io/sig-storage/csi-provisioner
        tag: v6.2.0
      snapshotter:
        repository: registry.k8s.io/sig-storage/csi-snapshotter
        tag: v8.6.0
      attacher:
        repository: registry.k8s.io/sig-storage/csi-attacher
        tag: v4.12.0
      resizer:
        repository: registry.k8s.io/sig-storage/csi-resizer
        tag: v2.1.0
      csiAddons:
        repository: quay.io/csiaddons/k8s-sidecar
        tag: v0.14.0
    ceph-csi-operator:
      nameOverride: ceph-csi
      fullnameOverride: ceph-csi
      controllerManager:
        manager:
          env:
            csiServiceAccountPrefix: ""
            watchNamespace: ""
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi