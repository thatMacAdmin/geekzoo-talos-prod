# A flux managed helm release for the rook operator
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-operator
  namespace: rook-ceph
spec:
  interval: 30m
  releaseName: rook-ceph
  chart:
    spec:
      chart: rook-ceph
      version: "1.21.0"
      sourceRef:
        kind: HelmRepository
        name: rook-operator
        namespace: rook-ceph
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  # Retain active CSI permissions until the v1.20 drivers release replaces them.
  postRenderers:
    - kustomize:
        patches:
          - target:
              name: ceph-csi-(rbd|cephfs)-(ctrlplugin|nodeplugin)-(sa|cr|crb|r|rb)
            patch: |
              - op: add
                path: /metadata/annotations
                value:
                  helm.sh/resource-policy: keep
          # Reconcile drivers after restoring the image-set ConfigMap.
          - target:
              kind: Deployment
              name: ceph-csi-controller-manager
            patch: |
              - op: add
                path: /spec/template/metadata/annotations
                value:
                  macbytes.io/csi-image-set-refresh: v3.17.1
  values:
    monitoring:
      enabled: true
    csi:
      installCsiOperator: true
      cephcsi:
        repository: quay.io/cephcsi/cephcsi
        tag: v3.17.1
      registrar:
        repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
        tag: v2.17.0
      provisioner:
        repository: registry.k8s.io/sig-storage/csi-provisioner
        tag: v6.2.0
      snapshotter:
        repository: registry.k8s.io/sig-storage/csi-snapshotter
        tag: v8.5.0
      attacher:
        repository: registry.k8s.io/sig-storage/csi-attacher
        tag: v4.12.0
      resizer:
        repository: registry.k8s.io/sig-storage/csi-resizer
        tag: v2.1.0
      csiAddons:
        repository: quay.io/csiaddons/k8s-sidecar
        tag: v0.14.0
    ceph-csi-operator:
      nameOverride: ceph-csi
      fullnameOverride: ceph-csi
      controllerManager:
        manager:
          env:
            csiServiceAccountPrefix: ""
            watchNamespace: ""
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi