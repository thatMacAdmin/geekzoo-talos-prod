# A flux managed helm release for the rook operator
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-operator
  namespace: rook-ceph
spec:
  interval: 30m
  releaseName: rook-ceph
  chart:
    spec:
      chart: rook-ceph
      version: "1.20.8"
      sourceRef:
        kind: HelmRepository
        name: rook-operator
        namespace: rook-ceph
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  # Retain active CSI permissions until the v1.20 drivers release replaces them.
  postRenderers:
    - kustomize:
        patches:
          - target:
              name: ceph-csi-(rbd|cephfs)-(ctrlplugin|nodeplugin)-(sa|cr|crb|r|rb)
            patch: |
              - op: add
                path: /metadata/annotations
                value:
                  helm.sh/resource-policy: keep
  values:
    monitoring:
      enabled: true
    csi:
      installCsiOperator: true
      cephcsi:
        repository: quay.io/cephcsi/cephcsi
        tag: v3.17.1
    ceph-csi-operator:
      nameOverride: ceph-csi
      fullnameOverride: ceph-csi
      controllerManager:
        manager:
          env:
            csiServiceAccountPrefix: ""
            watchNamespace: ""
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi