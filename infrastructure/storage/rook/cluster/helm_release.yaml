apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  interval: 30m
  # Daemon upgrades exceed Helm's five-minute default; retain Rook's safety gates.
  timeout: 20m
  releaseName: rook-ceph-cluster
  dependsOn:
    - name: ceph-csi-drivers
  chart:
    spec:
      chart: rook-ceph-cluster
      version: "1.21.0"
      sourceRef:
        kind: HelmRepository
        name: rook-operator
        namespace: rook-ceph
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  # Chart 1.21 adds optional CSI parameters; existing StorageClasses are immutable.
  # Preserve ceph-block rather than delete/recreate the class used by live PVCs.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StorageClass
              name: ceph-block
            patch: |
              - op: remove
                path: /parameters/csi.storage.k8s.io~1controller-modify-secret-name
              - op: remove
                path: /parameters/csi.storage.k8s.io~1controller-modify-secret-namespace
              - op: remove
                path: /parameters/csi.storage.k8s.io~1node-publish-secret-name
              - op: remove
                path: /parameters/csi.storage.k8s.io~1node-publish-secret-namespace
  valuesFrom:
    - kind: ConfigMap
      name: rook-ceph-cluster-values
      valuesKey: values.yaml
