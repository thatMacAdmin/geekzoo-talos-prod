apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: frpc-image-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: frpc
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)-alpine$'
    extract: '$version'
  policy:
    semver:
      range: ">=0.69.1 <0.78.0"
