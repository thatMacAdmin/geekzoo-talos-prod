apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: bifrost-image-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: bifrost
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      # Automatically adopt stable minor/patch releases, never a new major.
      range: ">=2.2.6 <3.0.0"
