apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: mousehole-image-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: mousehole
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: ">=0.5.0 <0.6.0"
