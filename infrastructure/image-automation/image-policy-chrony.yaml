apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: chrony-image-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: chrony
  filterTags:
    # dockurr/chrony publishes X.Y tags, which Flux semver rejects, so compare as X.Y.0.
    pattern: '^(?P<version>\d+\.\d+)$'
    extract: '$version.0'
  policy:
    semver:
      range: ">=4.7.0 <5.0.0"
