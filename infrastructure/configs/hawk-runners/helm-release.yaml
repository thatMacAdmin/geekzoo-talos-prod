apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hawk-runners
  namespace: hawk-runners
spec:
  interval: 30m
  releaseName: hawk-runners
  dependsOn:
    - name: actions-runner-controller
      namespace: arc-system
  chart:
    spec:
      chart: gha-runner-scale-set
      version: "0.15.1"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: hawk-runners
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  valuesFrom:
    - kind: ConfigMap
      name: hawk-runners-values
      valuesKey: values.yaml
