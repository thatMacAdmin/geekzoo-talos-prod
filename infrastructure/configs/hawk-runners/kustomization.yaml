apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helm-repository.yaml
  - helm-release.yaml
  - network-policy.yaml
  - resource-quota.yaml

configMapGenerator:
  - name: hawk-runners-values
    namespace: hawk-runners
    files:
      - values.yaml=helm-values.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
