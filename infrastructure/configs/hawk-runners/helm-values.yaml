githubConfigUrl: https://github.com/thatMacAdmin/hawk
githubConfigSecret: hawk-runner-github
runnerScaleSetName: hawk-runners
minRunners: 0
maxRunners: 2

controllerServiceAccount:
  namespace: arc-system
  name: actions-runner-controller

# Custom DinD template: native sidecar, bounded storage, Unix socket only.
# No hostPath, host network, or production Kubernetes credentials.
containerMode: {}
template:
  metadata:
    labels:
      app: hawk-runner
      app.kubernetes.io/name: hawk-runner
      app.kubernetes.io/instance: hawk-runners
      app.kubernetes.io/component: ci-runner
      app.kubernetes.io/part-of: system
      app.kubernetes.io/managed-by: kustomize
  spec:
    automountServiceAccountToken: false
    nodeSelector:
      kubernetes.io/arch: amd64
    securityContext:
      fsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    initContainers:
      - name: dind
        image: docker:29.9.2-dind
        restartPolicy: Always
        command: [sh, -ec]
        args:
          - |
            # Privileged DinD sees the host cgroup tree. Docker's default
            # /docker parent escapes Kubernetes' CPU/memory accounting.
            # Keep all child containers below this pod's bounded cgroup.
            read -r cgroup < /proc/self/cgroup
            container_cgroup="${cgroup#0::}"
            pod_cgroup="${container_cgroup%/*}"
            test -n "$pod_cgroup"
            test "$pod_cgroup" != /
            printf '%s\n' "$pod_cgroup" > /var/run/docker-cgroup-parent
            exec /usr/local/bin/dockerd-entrypoint.sh dockerd \
              --host=unix:///var/run/docker.sock \
              --group=1001 \
              --tls=false \
              --dns=1.1.1.1 \
              --cgroup-parent="$pod_cgroup"
        env:
          - name: DOCKER_TLS_CERTDIR
            value: ""
        securityContext:
          privileged: true
          runAsUser: 0
        startupProbe:
          exec:
            command: [docker, info]
          periodSeconds: 5
          failureThreshold: 36
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
            ephemeral-storage: 4Gi
          limits:
            cpu: "4"
            memory: 8Gi
            ephemeral-storage: 30Gi
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: docker-data
            mountPath: /var/lib/docker
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.1
        command: [/home/runner/run.sh]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          # Hawk installs per-job build tools with the stock runner's sudo.
          allowPrivilegeEscalation: true
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
            ephemeral-storage: 4Gi
          limits:
            cpu: "4"
            memory: 8Gi
            ephemeral-storage: 10Gi
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
    volumes:
      - name: work
        emptyDir:
          sizeLimit: 10Gi
      - name: dind-sock
        emptyDir: {}
      - name: docker-data
        emptyDir:
          sizeLimit: 30Gi

listenerTemplate:
  spec:
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: listener
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
