apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actions-runner-controller
  namespace: arc-system
spec:
  interval: 30m
  releaseName: actions-runner-controller
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      version: "0.15.1"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: arc-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: actions-runner-controller-values
      valuesKey: values.yaml
