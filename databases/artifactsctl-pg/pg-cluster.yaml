apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: artifactsctl-pg-cluster
  namespace: database
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-system-trixie
  instances: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  enableSuperuserAccess: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: wasabi-object-store
        serverName: artifactsctl-pg-cluster-geekzoo-prod
  bootstrap:
    initdb:
      database: artifactsctl
      owner: artifactsctl
      secret:
        name: pg-app-user-artifactsctl
  managed:
    roles:
      - name: artifactsctl
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: pg-app-user-artifactsctl
  storage:
    storageClass: ceph-block
    size: 10Gi
