apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: beyla
  namespace: observability
spec:
  interval: 30m
  releaseName: beyla
  timeout: 15m
  chart:
    spec:
      chart: beyla
      # Range, floor 1.16.8 (the deployed version). Upgrades previously stalled
      # on the default 5m timeout (helm-controller client rate limiter: rate: Wait
      # would exceed context deadline), so spec.timeout is widened to 15m.
      version: ">=1.16.8 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: observability
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  valuesFrom:
    - kind: ConfigMap
      name: beyla-values
      valuesKey: values.yaml
