apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: beyla
  namespace: observability
spec:
  interval: 30m
  releaseName: beyla
  # Old pods can take many minutes to stop (container kills hit the runtime
  # deadline) and the DaemonSet replaces one at a time. A 15m timeout was too
  # short for three nodes and triggered a rollback on 2026-10-31.
  timeout: 45m
  chart:
    spec:
      chart: beyla
      # Range, floor 1.16.8. Upgrades previously stalled on the default 5m timeout.
      version: ">=1.16.8 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: observability
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  valuesFrom:
    - kind: ConfigMap
      name: beyla-values
      valuesKey: values.yaml
