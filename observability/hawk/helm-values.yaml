clusterID: geekzoo-prod

# The namespace (privileged, for the agent) is in infrastructure/namespaces/.
namespace:
  create: false

image:
  pullSecrets:
    - ghcr-pull-secret

# Single-node ClickHouse for the Store, run by the chart. Its generated passwords
# live in the Secret hawk-store, which the chart keeps across upgrades and uninstall.
clickhouse:
  enabled: true
  storage:
    size: 20Gi
    storageClass: ceph-block

agent:
  # Temporary: Go profiling on the agent's pod-local loopback, to find why agents
  # stop discovering new containers on this cluster. Reach it with
  # kubectl port-forward. Remove once that is fixed.
  extraArgs:
    - --pprof-addr=127.0.0.1:6060
