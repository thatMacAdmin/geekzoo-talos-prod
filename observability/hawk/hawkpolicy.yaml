# How Hawk behaves cluster-wide (docs/hawkpolicy.md in the Hawk repo). Hawk reads
# only the policy named "default"; anything left out keeps the agents' flags.
apiVersion: hawk.dev/v1alpha1
kind: HawkPolicy
metadata:
  name: default
  labels:
    app.kubernetes.io/name: hawk
    app.kubernetes.io/part-of: observability
spec:
  volumeExemptions:
    # The TrueNAS media library (NFS, 203 TiB, infrastructure/storage/nfs/media_nfs_*),
    # mounted by the media apps at /media (audiobookshelf at /audiobooks). It is
    # neither watched nor scanned; each mount shows as a Coverage Gap
    # exempt-volume:<mount point> and in hawk_exempted_volumes.
    - name: media-library
      reason: The TrueNAS media library changes all day by design and is too large to scan.
      claims:
        - media/pvc-media-nfs
