apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hawk-ui-ingressroute
  namespace: hawk-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`hawk.macbytes.io`)
      kind: Rule
      services:
        - name: hawk-ui
          port: 3000
  tls:
    secretName: hawk-ui-tls-certificate
