apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helm-repository.yaml
  - helm-release.yaml
  - hawkpolicy.yaml
  - rbac.yaml
  - certificate.yaml
  - ingress.yaml

configMapGenerator:
  - name: hawk-values
    namespace: hawk-system
    files:
      - values.yaml=helm-values.yaml

generatorOptions:
  disableNameSuffixHash: true
