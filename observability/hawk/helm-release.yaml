apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hawk
  namespace: hawk-system
spec:
  interval: 30m
  releaseName: hawk
  # The migrate Job waits for ClickHouse and its PVC, and the services wait for the
  # users it creates.
  timeout: 15m
  chart:
    spec:
      chart: hawk
      # Every merge to hawk's develop branch publishes 0.1.0-dev.<run>; this follows them.
      version: ">=0.1.0-0"
      interval: 10m
      sourceRef:
        kind: HelmRepository
        name: hawk
        namespace: hawk-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: hawk-values
      valuesKey: values.yaml
