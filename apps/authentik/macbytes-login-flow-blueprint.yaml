apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-macbytes-login-flow-blueprint
  namespace: identity
data:
  macbytes-login-flow.yaml: |
    version: 1
    metadata:
      name: Macbytes - Friendly passkey-first authentication flow
    entries:
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Password change flow
          required: false
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - WebAuthn MFA setup flow
          required: false

      - model: authentik_flows.flow
        id: macbytes-authentication-flow
        identifiers:
          slug: macbytes-passkey-first-authentication-flow
        attrs:
          designation: authentication
          name: Macbytes Friendly Login
          title: Sign in to GeekZoo
          authentication: none
          # Renders a regular DOM instead of shadow DOM so password managers find the fields.
          compatibility_mode: true

      - model: authentik_stages_password.passwordstage
        id: macbytes-password
        identifiers:
          name: macbytes-authentication-password
        attrs:
          backends:
            - authentik.core.auth.InbuiltBackend
            - authentik.sources.kerberos.auth.KerberosBackend
            - authentik.sources.ldap.auth.LDAPBackend
            - authentik.core.auth.TokenBackend
          configure_flow: !Find [authentik_flows.flow, [slug, default-password-change]]

      - model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
        id: macbytes-passkey-setup
        identifiers:
          name: macbytes-authentication-passkey-setup
        attrs:
          configure_flow: !Find [authentik_flows.flow, [slug, default-authenticator-webauthn-setup]]
          friendly_name: Macbytes Passkey
          resident_key_requirement: required
          user_verification: preferred

      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        id: macbytes-passkey-first-validation
        identifiers:
          name: macbytes-authentication-passkey-first-validation
        attrs:
          device_classes:
            - webauthn
          not_configured_action: skip
          webauthn_user_verification: preferred

      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        id: macbytes-passkey-enrollment-validation
        identifiers:
          name: macbytes-authentication-passkey-enrollment-validation
        attrs:
          device_classes:
            - webauthn
          not_configured_action: configure
          configuration_stages:
            - !KeyOf macbytes-passkey-setup
          webauthn_user_verification: preferred

      - model: authentik_stages_identification.identificationstage
        id: macbytes-identification
        identifiers:
          name: macbytes-authentication-identification
        attrs:
          user_fields:
            - email
            - username
          webauthn_stage: !KeyOf macbytes-passkey-first-validation
          enable_remember_me: true
          pretend_user_exists: true

      - model: authentik_stages_user_login.userloginstage
        id: macbytes-login
        identifiers:
          name: macbytes-authentication-login

      - model: authentik_flows.flowstagebinding
        identifiers:
          order: 10
          stage: !KeyOf macbytes-identification
          target: !KeyOf macbytes-authentication-flow

      - model: authentik_flows.flowstagebinding
        id: macbytes-passkey-first-validation-binding
        identifiers:
          order: 20
          stage: !KeyOf macbytes-passkey-first-validation
          target: !KeyOf macbytes-authentication-flow
        attrs:
          re_evaluate_policies: true

      - model: authentik_flows.flowstagebinding
        id: macbytes-password-binding
        identifiers:
          order: 30
          stage: !KeyOf macbytes-password
          target: !KeyOf macbytes-authentication-flow
        attrs:
          re_evaluate_policies: true

      - model: authentik_flows.flowstagebinding
        id: macbytes-passkey-enrollment-validation-binding
        identifiers:
          order: 40
          stage: !KeyOf macbytes-passkey-enrollment-validation
          target: !KeyOf macbytes-authentication-flow
        attrs:
          re_evaluate_policies: true

      - model: authentik_flows.flowstagebinding
        identifiers:
          order: 100
          stage: !KeyOf macbytes-login
          target: !KeyOf macbytes-authentication-flow

      - model: authentik_policies_expression.expressionpolicy
        id: macbytes-password-optional
        identifiers:
          name: macbytes-authentication-password-stage
        attrs:
          expression: |
            flow_plan = request.context.get("flow_plan")
            if not flow_plan:
                return True
            if hasattr(flow_plan.context.get("pending_user"), "backend"):
                return False
            return flow_plan.context.get("auth_method") != "auth_mfa"

      - model: authentik_policies_expression.expressionpolicy
        id: macbytes-passkey-first-validation-optional
        identifiers:
          name: macbytes-authentication-passkey-first-validation-stage
        attrs:
          expression: |
            flow_plan = request.context.get("flow_plan")
            if not flow_plan:
                return True
            return not (flow_plan.context.get("auth_method") == "auth_webauthn_pwl")

      - model: authentik_policies_expression.expressionpolicy
        id: macbytes-passkey-enrollment-required
        identifiers:
          name: macbytes-authentication-passkey-enrollment-stage
        attrs:
          expression: |
            flow_plan = request.context.get("flow_plan")
            if not flow_plan:
                return True
            if flow_plan.context.get("auth_method") in ["auth_webauthn_pwl", "auth_mfa"]:
                return False
            user = flow_plan.context.get("pending_user")
            if not user or not getattr(user, "pk", None):
                return False
            from authentik.stages.authenticator_webauthn.models import WebAuthnDevice
            return not WebAuthnDevice.objects.filter(user=user, confirmed=True).exists()

      - model: authentik_policies.policybinding
        identifiers:
          order: 10
          target: !KeyOf macbytes-password-binding
          policy: !KeyOf macbytes-password-optional
        attrs:
          failure_result: true

      - model: authentik_policies.policybinding
        identifiers:
          order: 10
          target: !KeyOf macbytes-passkey-first-validation-binding
          policy: !KeyOf macbytes-passkey-first-validation-optional
        attrs:
          failure_result: true

      - model: authentik_policies.policybinding
        identifiers:
          order: 10
          target: !KeyOf macbytes-passkey-enrollment-validation-binding
          policy: !KeyOf macbytes-passkey-enrollment-required
        attrs:
          failure_result: true

      - model: authentik_brands.brand
        identifiers:
          domain: authentik-default
          default: true
        attrs:
          branding_title: Macbytes
          branding_custom_css: |
            /* GeekZoo sign-in: neutral, shadcn-like layout in Monokai Pro colours
               (dark: Monokai Pro, light: Monokai Pro Sun), following the page theme.
               Scoped to the flow (login) interface through ak-flow-executor, .pf-c-login and
               ak-flow-card, so the admin and user interfaces keep authentik's stock theme.
               :not(#gz) only raises specificity: in compatibility mode component styles are
               scoped document styles that would otherwise win.
               Two colours are nudged off-palette for WCAG contrast: the dark input border
               and the light error text. */

            body:has(ak-flow-executor) {
              --ak-global--background-image: none;
              --ak-global--background-color: #221f22;
              background-color: #221f22;
            }

            [data-theme="light"] body:has(ak-flow-executor) {
              --ak-global--background-color: #faf4f2;
              background-color: #faf4f2;
            }

            ak-flow-executor {
              color-scheme: dark;

              --gz-background: #221f22;
              --gz-card: #2d2a2e;
              --gz-foreground: #fcfcfa;
              --gz-muted: #c1c0c0;
              --gz-placeholder: #939293;
              --gz-border: #403e41;
              --gz-input: #7a787a;
              --gz-ring: #ffd866;
              --gz-ring-soft: rgba(255, 216, 102, 0.25);
              --gz-primary: #fcfcfa;
              --gz-primary-foreground: #2d2a2e;
              --gz-secondary: #403e41;
              --gz-accent: #a9dc76;
              --gz-destructive: #ff6188;
              --gz-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
              --gz-radius: 0.5rem;
              --gz-radius-lg: 0.75rem;
              --gz-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
              --gz-font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

              --pf-global--primary-color--100: var(--gz-primary);
              --pf-global--primary-color--200: var(--gz-primary);
              --pf-global--link--Color: var(--gz-foreground);
              --pf-global--link--Color--hover: var(--gz-foreground);
              --pf-global--Color--100: var(--gz-foreground);
              --pf-global--Color--200: var(--gz-muted);
              --pf-global--BorderColor--100: var(--gz-border);
              --pf-global--BackgroundColor--100: var(--gz-card);
              --pf-global--BackgroundColor--200: var(--gz-background);
              --pf-global--danger-color--100: var(--gz-destructive);
              --pf-global--FontFamily--sans-serif: var(--gz-font);
              --pf-global--FontFamily--heading--sans-serif: var(--gz-font);
              --ak-font-family-sans-serif: var(--gz-font);
              --ak-font-family-heading: var(--gz-font);
              /* stock drop-shadow that keeps text legible over a background image */
              --ak-global--BackgroundContrastFilter: none;

              font-family: var(--gz-font);
              color: var(--gz-foreground);
              -webkit-font-smoothing: antialiased;
            }

            [data-theme="light"] ak-flow-executor {
              color-scheme: light;

              --gz-background: #faf4f2;
              --gz-card: #fefaf9;
              --gz-foreground: #29242a;
              --gz-muted: #706b6e;
              --gz-placeholder: #706b6e;
              --gz-border: #e0dad9;
              --gz-input: #918c8e;
              --gz-ring: #e14775;
              --gz-ring-soft: rgba(225, 71, 117, 0.2);
              --gz-primary: #29242a;
              --gz-primary-foreground: #fefaf9;
              --gz-secondary: #ede7e5;
              --gz-accent: #269d69;
              --gz-destructive: #c7305f;
              --gz-shadow: 0 1px 2px rgba(41, 36, 42, 0.08);
            }

            /* Page */
            .pf-c-login:not(#gz) {
              --ak-c-login__main--BackgroundColor: var(--gz-card);
              --ak-c-login__main--BoxShadow: none;
              --ak-c-login__main--Color: var(--gz-foreground);
              --ak-c-login__footer--Color: var(--gz-muted);
              background: var(--gz-background);
              font-family: var(--gz-font);
            }

            /* Card */
            .pf-c-login__main:not(#gz) {
              width: 100%;
              max-width: 24rem;
              margin-inline: auto;
              border: 1px solid var(--gz-border);
              border-radius: var(--gz-radius-lg);
              background: var(--gz-card);
              color: var(--gz-foreground);
              box-shadow: var(--gz-shadow);
              overflow: hidden;
            }

            /* Brand: a small wordmark replaces the logo image */
            .pf-c-login__main-header.pf-c-brand:not(#gz) {
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 0.5rem;
              padding-block: 1.75rem 0.25rem;
            }

            .pf-c-login__main-header.pf-c-brand:not(#gz) .branding-logo {
              display: none;
            }

            .pf-c-login__main-header.pf-c-brand:not(#gz)::before {
              /* authentik rewrites a literal greater-than sign in brand CSS, so use a CSS escape */
              content: "\3E_";
              display: grid;
              place-items: center;
              width: 1.75rem;
              height: 1.75rem;
              border: 1px solid var(--gz-border);
              border-radius: 0.4rem;
              background: var(--gz-secondary);
              color: var(--gz-accent);
              font-family: var(--gz-font-mono);
              font-size: 0.75rem;
              font-weight: 700;
              letter-spacing: -0.05em;
            }

            .pf-c-login__main-header.pf-c-brand:not(#gz)::after {
              content: "GeekZoo";
              color: var(--gz-foreground);
              font-family: var(--gz-font);
              font-size: 0.95rem;
              font-weight: 600;
              letter-spacing: -0.01em;
            }

            /* Title */
            .pf-c-login__main-header:not(#gz) .pf-c-title {
              font-family: var(--gz-font);
              font-size: 1.25rem;
              line-height: 1.75rem;
              font-weight: 600;
              letter-spacing: -0.02em;
              text-align: center;
            }

            /* Form text */
            ak-flow-card:not(#gz) .pf-c-form__label,
            ak-flow-card:not(#gz) .pf-c-form__label-text {
              font-size: 0.875rem;
              font-weight: 500;
            }

            ak-flow-card:not(#gz) .pf-c-form {
              --pf-c-form__label-required--Color: var(--gz-muted);
            }

            ak-flow-card:not(#gz) .pf-c-form__helper-text {
              font-size: 0.8125rem;
              color: var(--gz-muted);
            }

            ak-flow-card:not(#gz) .pf-c-form__helper-text.pf-m-error {
              color: var(--gz-destructive);
            }

            /* Inputs */
            ak-flow-card:not(#gz) .pf-c-form-control {
              height: 2.25rem;
              padding: 0.25rem 0.75rem;
              border: 1px solid var(--gz-input);
              border-radius: var(--gz-radius);
              background: transparent;
              color: var(--gz-foreground);
              font-size: 0.875rem;
              box-shadow: none;
              outline: 2px solid transparent;
              transition: border-color 0.15s, box-shadow 0.15s;
            }

            ak-flow-card:not(#gz) .pf-c-form-control::placeholder {
              color: var(--gz-placeholder);
              font-style: normal;
              opacity: 1;
            }

            ak-flow-card:not(#gz) .pf-c-form-control:focus,
            ak-flow-card:not(#gz) .pf-c-form-control:focus-visible {
              border-color: var(--gz-ring);
              box-shadow: 0 0 0 3px var(--gz-ring-soft);
            }

            /* Buttons */
            ak-flow-card:not(#gz) .pf-c-button {
              border-radius: var(--gz-radius);
              font-size: 0.875rem;
              font-weight: 500;
            }

            ak-flow-card:not(#gz) .pf-c-button::after {
              border-radius: var(--gz-radius);
            }

            ak-flow-card:not(#gz) .pf-c-button.pf-m-primary {
              min-height: 2.25rem;
              background: var(--gz-primary);
              color: var(--gz-primary-foreground);
              box-shadow: none;
              transition: opacity 0.15s;
            }

            ak-flow-card:not(#gz) .pf-c-button.pf-m-primary:hover {
              background: var(--gz-primary);
              opacity: 0.9;
            }

            ak-flow-card:not(#gz) .pf-c-button:focus-visible {
              outline: 2px solid var(--gz-ring);
              outline-offset: 2px;
            }

            ak-flow-card:not(#gz) .pf-c-button.pf-m-primary:disabled {
              opacity: 0.5;
            }

            ak-flow-card:not(#gz) .pf-c-button.pf-m-secondary,
            ak-flow-card:not(#gz) .pf-c-button.pf-m-control {
              background: transparent;
              color: var(--gz-foreground);
            }

            ak-flow-card:not(#gz) .pf-c-button.pf-m-secondary::after,
            ak-flow-card:not(#gz) .pf-c-button.pf-m-control::after {
              border: 1px solid var(--gz-input);
            }

            ak-flow-card:not(#gz) .pf-c-button.pf-m-secondary:hover,
            ak-flow-card:not(#gz) .pf-c-button.pf-m-control:hover {
              background: var(--gz-secondary);
            }

            /* Links */
            ak-flow-card:not(#gz) a,
            .pf-c-login__main:not(#gz) a {
              color: var(--gz-foreground);
              text-decoration: underline;
              text-decoration-color: var(--gz-input);
              text-underline-offset: 0.25em;
            }

            ak-flow-card:not(#gz) a:hover,
            .pf-c-login__main:not(#gz) a:hover {
              text-decoration-color: var(--gz-foreground);
            }

            /* Remember-me checkbox */
            ak-flow-card:not(#gz) input[type="checkbox"] {
              accent-color: var(--gz-primary);
            }

            ak-flow-card:not(#gz) .remember-me-switch .pf-c-form__label {
              color: var(--gz-muted);
              font-weight: 400;
            }

            /* Alerts */
            ak-flow-card:not(#gz) .pf-c-alert {
              border: 1px solid var(--gz-border);
              border-radius: var(--gz-radius);
              background: transparent;
              box-shadow: none;
            }

            /* Footer and locale picker */
            .pf-c-login__footer:not(#gz) {
              font-size: 0.75rem;
              color: var(--gz-muted);
            }

            ak-locale-select:not(#gz) {
              --ak-c-locale-select--Color: var(--gz-muted);
              --ak-c-locale-select--label--Color: var(--gz-muted);
              font-size: 0.8125rem;
            }

            @media (max-width: 35rem) {
              .pf-c-login__main:not(#gz) {
                max-width: none;
                border-inline: 0;
                border-radius: 0;
              }
            }

            @media (prefers-reduced-motion: reduce) {
              .pf-c-login:not(#gz) *,
              ak-flow-card:not(#gz) * {
                transition: none !important;
                animation: none !important;
              }
            }
          attributes:
            settings:
              theme:
                # Follow the visitor's system light/dark preference (all interfaces).
                base: automatic
          flow_authentication: !KeyOf macbytes-authentication-flow
