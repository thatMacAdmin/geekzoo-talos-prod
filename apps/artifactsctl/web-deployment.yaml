apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifactsctl
  namespace: artifactsctl
  labels:
    app: artifactsctl
    app.kubernetes.io/name: artifactsctl
    app.kubernetes.io/instance: artifactsctl
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: apps
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app: artifactsctl
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: artifactsctl
        app.kubernetes.io/name: artifactsctl
        app.kubernetes.io/instance: artifactsctl
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: apps
        app.kubernetes.io/managed-by: kustomize
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: web
          image: ghcr.io/thatmacadmin/artifactsctl:9a94feff72b1de8648da76fac163aca4bc24a27d
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: artifactsctl
                  key: database-url
            - name: ARTIFACTS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: artifactsctl
                  key: artifacts-api-key
            - name: ORIGIN
              value: https://artifactsctl.macbytes.io
            - name: RUNNER_SEPARATE_PROCESS
              value: "true"
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
