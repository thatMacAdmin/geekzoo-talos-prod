apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bifrost
  namespace: apps
spec:
  interval: 10m
  releaseName: bifrost
  chart:
    spec:
      chart: bifrost
      # Chart appVersion lags the stable HTTP release; helm-values.yaml pins
      # the application image separately and enables same-major tag automation.
      version: "2.1.43"
      sourceRef:
        kind: HelmRepository
        name: bifrost
        namespace: apps
  valuesFrom:
    - kind: ConfigMap
      name: bifrost-helm-values
      valuesKey: values.yaml
