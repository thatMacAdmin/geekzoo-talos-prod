apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-app-user-artifactsctl
  namespace: database
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: secretstore-aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: pg-app-user-artifactsctl
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  dataFrom:
    - extract:
        key: /k3s-geekzoo/pg-app-user-artifactsctl
