apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hawk-runner-github
  namespace: hawk-runners
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: secretstore-aws-parameter-store
    kind: ClusterSecretStore
  target:
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /k3s-geekzoo/hawk-runner-github
