apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-tls-sync
  namespace: mail
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: secretstore-aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: stalwart-tls-sync
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: /k3s-geekzoo/mail/stalwart-tls-sync
