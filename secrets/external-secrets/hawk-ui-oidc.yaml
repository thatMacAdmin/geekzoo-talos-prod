# The Hawk UI's Authentik client secret and the key that encrypts its session
# cookie. SSM SecureString /k3s-geekzoo/hawk-ui-oidc holds JSON:
#   {"client-secret": "<from Authentik>", "session-secret": "<openssl rand -base64 48>"}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hawk-ui-oidc
  namespace: hawk-system
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: secretstore-aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: hawk-ui-oidc
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /k3s-geekzoo/hawk-ui-oidc
